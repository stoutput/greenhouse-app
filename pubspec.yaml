publish_to: 'none'
version: 0.1.9+10

environment:
  sdk: ^3.13.7

dependencies:
  crypto: ^3.0.7
  device_info_plus: ^13.3.0
  firebase_core: ^4.0.0
  firebase_messaging: ^16.0.0
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.2
  http: ^1.6.0
